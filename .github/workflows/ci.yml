name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Scripts parse
        run: node --check scripts/fetch-snapshots.mjs && node --check scripts/fetch-clouds.mjs && node --check scripts/fetch-textures.mjs && node --check scripts/fetch-weather.mjs
      - name: Data files are valid JSON
        run: |
          for f in site/data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: Site size stays under 1 GB (N-1.3)
        run: |
          size=$(du -sm site | cut -f1); echo "site: ${size} MB"; test "$size" -lt 900
      # Smoke test against the real sources; neither script fails the job on a source outage
      - name: Snapshots and clouds (smoke test)
        run: |
          node scripts/fetch-snapshots.mjs .cache/live site/data/live || true
          node scripts/fetch-clouds.mjs .cache/live site/data/live
          node scripts/fetch-weather.mjs .cache/live site/data/live
          cat site/data/live/weather.json || true
          node scripts/fetch-textures.mjs .cache/textures site/img/hi
          ls -la site/img/hi || true
          ls -la site/data/live
      - name: Probe (temporary)
        run: |
          curl -s 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0' > /tmp/caps.xml
          grep -o '<Name>[^<]*\(IMERG\|Precip\)[^<]*</Name>' /tmp/caps.xml | sort -u
          python3 - <<'EOF'
          import re
          s=open('/tmp/caps.xml').read()
          for m in re.finditer(r'<Layer[^>]*>\s*<Name>(IMERG[^<]*)</Name>(.*?)</Layer>', s, re.S):
              d=re.search(r'<Dimension[^>]*>([^<]*)</Dimension>', m.group(2)); dd=re.search(r'<Dimension[^>]*', m.group(2))
              print(m.group(1), (dd.group(0) if dd else ''), (d.group(1)[-200:] if d else 'no dim'))
          EOF
      # The preview build lets reviewers download and open the site locally (N-7.4).
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          retention-days: 7
