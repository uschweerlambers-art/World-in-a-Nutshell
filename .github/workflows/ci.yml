name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scripts parse
        run: node --check scripts/fetch-snapshots.mjs
      - name: Data files are valid JSON
        run: |
          for f in site/data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"; done
      - name: Site size stays under 1 GB (N-1.3)
        run: |
          size=$(du -sm site | cut -f1); echo "site: ${size} MB"; test "$size" -lt 900
      # The preview build lets reviewers download and open the site locally (N-7.4).
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
          retention-days: 7
