name: Data & Deploy

# Builds the site, refreshes the data snapshots and publishes to GitHub Pages.
# Runs on every push to main, every 15 minutes, and on demand.
# GitHub Pages allows about 10 publishes per hour, so the schedule stays at 4 per hour.

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build tools
        run: npm ci --no-audit --no-fund

      # Snapshots are never committed. The last good ones live in the Actions cache.
      - name: Restore last snapshots
        uses: actions/cache/restore@v4
        with:
          path: .cache/live
          key: live-${{ github.run_id }}
          restore-keys: live-

      - name: Fetch snapshots
        run: node scripts/fetch-snapshots.mjs .cache/live site/data/live

      # 8k Earth textures: built once from NASA GIBS, then kept in the cache
      - name: Restore 8k textures
        id: tex
        uses: actions/cache/restore@v4
        with:
          path: .cache/textures
          key: textures-v1

      - name: Build 8k textures (only if not cached)
        run: node scripts/fetch-textures.mjs .cache/textures site/img/hi

      - name: Save 8k textures
        if: steps.tex.outputs.cache-hit != 'true' && hashFiles('.cache/textures/*.jpg') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/textures
          key: textures-v1

      - name: Build cloud layer (NASA GIBS, at most every 3 h)
        run: node scripts/fetch-clouds.mjs .cache/live site/data/live

      - name: Weather maps (GFS wind and temperature, IMERG rain, aerosols)
        run: node scripts/fetch-weather.mjs .cache/live site/data/live

      - name: Place of the day (Wikimedia Commons pictures, today and tomorrow)
        run: node scripts/fetch-place-of-day.mjs .cache/live site/data/live

      - name: Wonders & records pictures (Wikimedia Commons, renewed every 30 days)
        run: node scripts/fetch-wonder-pictures.mjs .cache/live site/data/live

      # Needs the free aisstream.io key as repo secret AISSTREAM_API_KEY; without it the step only logs a note
      - name: Ships (aisstream.io, about one minute of live AIS)
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: node scripts/fetch-ships.mjs .cache/live site/data/live

      - name: Save snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/live
          key: live-${{ github.run_id }}-${{ github.run_attempt }}

      # Same snapshots as a plain artifact, for QA and local testing (kept 2 days)
      - uses: actions/upload-artifact@v4
        with:
          name: live-snapshots
          path: site/data/live
          retention-days: 2

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
